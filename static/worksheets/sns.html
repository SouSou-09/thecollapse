<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheCollapse - SNS</title>
<style>
  /* X（Twitter）風 仮デザイン（v2.2.0・モック。本実装は今後のアップデートで予定） */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #e7e9ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans JP", sans-serif;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: rgba(0,0,0,.85); backdrop-filter: blur(8px);
    border-bottom: 1px solid #2f3336;
  }
  .x-logo { width: 26px; height: 26px; fill: #e7e9ea; flex: none; }
  .title { font-size: 18px; font-weight: 800; }
  .beta {
    margin-left: auto; font-size: 11px; font-weight: 700;
    color: #fff; background: #1d9bf0; border-radius: 999px; padding: 3px 10px;
  }
  .tabs { display: flex; border-bottom: 1px solid #2f3336; position: sticky; top: 51px; background: #000; }
  .tab { flex: 1; text-align: center; padding: 14px 0; font-weight: 700; color: #71767b; cursor: default; position: relative; }
  .tab.active { color: #e7e9ea; }
  .tab.active::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 56px; height: 4px; border-radius: 999px; background: #1d9bf0; }
  .notice {
    margin: 14px 16px; padding: 14px 16px;
    border: 1px solid #2f3336; border-radius: 16px;
    font-size: 14px; color: #71767b; line-height: 1.6;
  }
  .notice strong { color: #e7e9ea; }
  /* タイムラインのスケルトン（モック） */
  .post { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #2f3336; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #2f3336; flex: none; }
  .lines { flex: 1; }
  .line { border-radius: 6px; background: #2f3336; height: 12px; margin-bottom: 9px; }
  .w40 { width: 40%; } .w70 { width: 70%; } .w95 { width: 95%; } .w85 { width: 85%; } .w55 { width: 55%; }
  footer { padding: 18px 16px 40px; text-align: center; font-size: 13px; color: #71767b; }
  footer a { color: #1d9bf0; }
</style>
</head>
<body>
  <header>
    <svg class="x-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    <span class="title">SNS</span>
    <span class="beta">β</span>
  </header>

  <div class="tabs">
    <div class="tab active">フォロー</div>
    <div class="tab">おすすめ</div>
  </div>

  <div class="notice">
    <strong>β準備中です。</strong>
    このページはX風の仮デザイン（モック）です。投稿・フォローなどの機能はまだ動作せず、
    本実装は今後のv2.2.0アップデートで予定しています。
  </div>

  <!-- タイムラインのダミー表示 -->
  <div class="post"><div class="avatar"></div><div class="lines">
    <div class="line w40"></div><div class="line w95"></div><div class="line w85"></div><div class="line w55"></div>
  </div></div>
  <div class="post"><div class="avatar"></div><div class="lines">
    <div class="line w40"></div><div class="line w95"></div><div class="line w70"></div><div class="line w85"></div>
  </div></div>
  <div class="post"><div class="avatar"></div><div class="lines">
    <div class="line w40"></div><div class="line w85"></div><div class="line w95"></div><div class="line w40"></div>
  </div></div>

  <footer><a href="../index.html">← ホームに戻る</a></footer>
</body>
</html>
